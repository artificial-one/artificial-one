name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - data/ai_news_sources.json
      - scripts/build_ai_news.py
      - scripts/publish_intelligent_news.py
      - scripts/setup_elephant_edge_ai.py
      - scripts/elephant_edge_ai.py
      - tests/test_ai_news_pipeline.py
      - tests/test_intelligent_news.py

permissions:
  contents: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the local open model and inference runtime
        uses: actions/cache@v5
        with:
          path: .edge-ai
          key: elephant-edge-ai-qwen3-4b-q4km-llama-b10982-v1

      - name: Test news safety rules
        run: python -m unittest tests.test_ai_news_pipeline tests.test_intelligent_news -v

      - name: Refresh allowlisted news feeds
        run: python scripts/build_ai_news.py

      - name: Prepare the free local Elephant model
        run: python scripts/setup_elephant_edge_ai.py

      - name: Publish evidence-gated Elephant news briefings
        env:
          ELEPHANT_MODEL_PATH: .edge-ai/qwen3-4b-q4_k_m.gguf
          LLAMA_CLI_PATH: .edge-ai/llama.cpp/build/bin/llama-cli
          AI_NEWS_MAX_NEW: "4"
          AI_NEWS_MAX_ATTEMPTS: "6"
          AI_NEWS_TIME_BUDGET: "2100"
        run: python scripts/publish_intelligent_news.py

      - name: Connect the news index to newly published briefings
        run: python scripts/build_ai_news.py --cached

      - name: Refresh crawl discovery and notify participating search engines
        env:
          INDEXNOW_SUBMIT_ENABLED: "true"
        run: python scripts/indexing_recovery.py --submit --state /tmp/indexnow-news.json

      - name: Verify generated output
        run: |
          python scripts/build_ai_news.py --check
          python scripts/indexing_recovery.py --check

      - name: Commit material news changes
        shell: bash
        run: |
          git add -- data/ai_news.json data/ai_news_archive.json data/indexing_recovery.json data/indexing_priority.json index.html news.html news-archive.html news-sitemap.xml news robots.txt buyers-guides.html sitemap.xml sitemap-priority.xml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh AI news [skip ci]"
          git push
