name: Refresh AI news

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    branches: [main]
    paths:
      - data/ai_news_sources.json
      - scripts/build_ai_news.py
      - tests/test_ai_news_pipeline.py

permissions:
  contents: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test news safety rules
        run: python -m unittest tests.test_ai_news_pipeline -v

      - name: Refresh allowlisted news feeds
        run: python scripts/build_ai_news.py

      - name: Verify generated output
        run: python scripts/build_ai_news.py --check

      - name: Commit material news changes
        shell: bash
        run: |
          git add -- data/ai_news.json index.html news.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh AI news [skip ci]"
          git push
