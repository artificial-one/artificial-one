name: Optimize affiliate revenue

on:
  workflow_dispatch:
    inputs:
      publish_social:
        description: Publish today's Bluesky editorial post
        required: false
        default: false
        type: boolean
  schedule:
    # Runs after the daily PartnerStack audit so fresh conversion data is available.
    - cron: "13 8 * * *"
  push:
    branches: [main]
    paths:
      - data/partner_offers.json
      - data/affiliate_placements.json
      - scripts/optimize_revenue.py
      - scripts/build_partner_offers.py
      - scripts/monetize_affiliate_links.py
      - assets/affiliate-tracking.js
      - api/affiliate-event.js
      - tests/test_revenue_optimizer.py
      - scripts/optimize_conversion.py
      - scripts/publish_newsletter.py
      - scripts/distribute_content.py
      - scripts/build_social_media.py
      - scripts/build_search_revenue_pages.py
      - scripts/appsumo_impact.py
      - data/appsumo_offers.json
      - data/content_routes.json
      - scripts/paid_acquisition.py
      - data/paid_acquisition_policy.json
      - data/sponsorship_inventory.json
      - scripts/build_decision_tools.py
      - scripts/build_sponsorship.py
      - scripts/indexing_recovery.py
      - scripts/monitor_offer_changes.py
      - scripts/build_tool_intelligence.py
      - scripts/monitor_tool_intelligence.py
      - tests/test_tool_intelligence.py
      - tests/test_appsumo_impact.py
      - tests/test_revenue_acceleration.py
      - tests/test_search_revenue_pages.py

permissions:
  contents: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install social-card image support
        run: python -m pip install --disable-pip-version-check "Pillow>=12.0.0"

      - name: Restore private publishing state
        uses: actions/cache@v5
        with:
          path: |
            .revenue-acceleration
            .offer-monitor/private-state.json
            .indexnow/private-state.json
          key: revenue-acceleration-${{ github.run_id }}
          restore-keys: |
            revenue-acceleration-

      - name: Rank offers from private performance signals
        env:
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python scripts/optimize_revenue.py

      - name: Optimize conversion copy from anonymous events
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python scripts/optimize_conversion.py

      - name: Build the tool finder and performance-ranked offer pages
        run: |
          python scripts/build_partner_offers.py
          python scripts/build_search_revenue_pages.py
          python scripts/monetize_affiliate_links.py
          python scripts/build_ai_news.py --cached
          python scripts/build_decision_tools.py
          python scripts/build_sponsorship.py
          python scripts/build_social_media.py
          python scripts/build_tool_intelligence.py

      - name: Monitor first-party offer changes
        run: python scripts/monitor_offer_changes.py --state .offer-monitor/private-state.json

      - name: Build newsletter, RSS, distribution, and paid-search plans
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          BEEHIIV_SEND_ENABLED: ${{ vars.BEEHIIV_SEND_ENABLED }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_DELETE_RKEY: ${{ vars.BLUESKY_DELETE_RKEY }}
          BLUESKY_MARK_SENT_ID: ${{ vars.BLUESKY_MARK_SENT_ID }}
          DISTRIBUTION_WEBHOOK_URL: ${{ secrets.DISTRIBUTION_WEBHOOK_URL }}
          # Scheduled runs publish once. Pushes only rebuild content; a manual run
          # publishes only when its explicit checkbox is enabled.
          DISTRIBUTION_SEND_ENABLED: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_social)) && vars.DISTRIBUTION_SEND_ENABLED || 'false' }}
          PAID_ADS_LIVE: ${{ vars.PAID_ADS_LIVE }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_API_VERSION: ${{ vars.GOOGLE_ADS_API_VERSION }}
        run: |
          python scripts/publish_newsletter.py --state .revenue-acceleration/newsletter.json
          python scripts/distribute_content.py --state .revenue-acceleration/distribution.json
          python scripts/paid_acquisition.py

      # Crawl assets must be calculated after every public content writer above;
      # otherwise the final indexability audit can correctly detect stale inputs.
      - name: Build crawl discovery and notify participating search engines
        env:
          INDEXNOW_SUBMIT_ENABLED: "true"
        run: python scripts/indexing_recovery.py --submit

      - name: Verify the complete revenue pipeline
        run: |
          python -m unittest discover -s tests -v
          node --check assets/affiliate-tracking.js
          node --check api/affiliate-event.js
          python scripts/build_partner_offers.py --check
          python scripts/build_search_revenue_pages.py --check
          python scripts/monetize_affiliate_links.py --check
          python scripts/build_ai_news.py --check
          python scripts/build_decision_tools.py --check
          python scripts/build_sponsorship.py --check
          python scripts/build_social_media.py --check
          python scripts/monitor_offer_changes.py --check
          python scripts/build_tool_intelligence.py --check
          python scripts/monitor_tool_intelligence.py --check
          python scripts/indexing_recovery.py --check
          node --check api/sponsor-checkout.js
          node --check api/sponsor-intake.js

      - name: Commit only public, privacy-safe optimization output
        shell: bash
        run: |
          git add -- data/revenue_strategy.json data/conversion_strategy.json data/content_routes.json data/distribution_queue.json data/paid_campaign_plan.json data/offer_change_alerts.json data/indexing_recovery.json data/tool_intelligence.json data/ai-tool-intelligence.csv data/tool_change_history.json ai-tool-finder.html ai-tool-database.html ai-tool-alternatives.html ai-tool-changes.html index.html news.html newsletter feed.xml partner-offers.html partner-offers search-intent calculators decision-tools.html ai-stack-builder.html buyers-guides.html offer-updates.html sponsor.html sponsor-success.html sitemap.xml assets/affiliate-tracking.js api/affiliate-event.js a10e20260915d74b93c2f18e7a45c901.txt images/social images/social-cards ':(glob)**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize affiliate revenue [skip ci]"
          git push

      - name: Publish a privacy-safe run summary
        run: |
          echo "## Affiliate revenue optimizer" >> "$GITHUB_STEP_SUMMARY"
          echo "Offers were ranked using anonymous site interactions and PartnerStack conversion signals; decision tools, change alerts and crawl discovery were refreshed." >> "$GITHUB_STEP_SUMMARY"
          echo "Only the resulting offer order was committed; traffic counts and customer data remain private." >> "$GITHUB_STEP_SUMMARY"
