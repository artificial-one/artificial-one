name: Search growth engine

on:
  workflow_dispatch:
  schedule:
    # Daily index health; guarded copy experiments have 14-day minimum windows.
    - cron: "11 6 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@v3
        with:
          project_id: artificial-one-growth
          workload_identity_provider: projects/932498409311/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: artificial-one-search-growth@artificial-one-growth.iam.gserviceaccount.com

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Google authentication library
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Restore private experiment baselines
        uses: actions/cache@v5
        with:
          path: |
            .search-growth/private-state.json
            .search-growth/executive-snapshot.json
            .indexnow/private-state.json
          key: search-growth-private-${{ github.run_id }}
          restore-keys: |
            search-growth-private-

      - name: Audit indexing, analyze demand, and run guarded experiments
        id: search
        run: python scripts/search_revenue_engine.py --private-state .search-growth/private-state.json

      - name: Build revenue-focused search pages
        run: |
          python scripts/build_partner_offers.py
          python scripts/build_price_plan_tracker.py
          python scripts/build_search_revenue_pages.py
          python scripts/monetize_affiliate_links.py
          python scripts/build_ai_news.py --cached
          python scripts/build_decision_tools.py
          python scripts/build_sponsorship.py
          python scripts/monitor_offer_changes.py --cached
          python scripts/build_tool_intelligence.py
          python scripts/build_affiliate_growth_loop.py
          python scripts/consolidate_legacy_index.py
          python scripts/seo_hygiene.py
          INDEXNOW_SUBMIT_ENABLED=true python scripts/indexing_recovery.py --submit

      - name: Verify the complete publishing loop
        run: |
          python -m unittest discover -s tests -v
          node --check assets/affiliate-tracking.js
          node --check api/affiliate-event.js
          python scripts/build_partner_offers.py --check
          python scripts/build_price_plan_tracker.py --check
          python scripts/build_search_revenue_pages.py --check
          python scripts/monetize_affiliate_links.py --check
          python scripts/build_ai_news.py --check
          python scripts/build_decision_tools.py --check
          python scripts/build_sponsorship.py --check
          python scripts/monitor_offer_changes.py --check
          python scripts/build_tool_intelligence.py --check
          python scripts/build_affiliate_growth_loop.py --check
          python scripts/monitor_tool_intelligence.py --check
          python scripts/consolidate_legacy_index.py --check
          python scripts/indexing_recovery.py --check

      - name: Commit only public, privacy-safe winners and generated pages
        shell: bash
        run: |
          git add -- data/search_growth_strategy.json data/indexing_recovery.json data/indexing_priority.json data/indexing_request_queue.json data/legacy_index_consolidation.json data/tool_intelligence.json data/affiliate_growth_loop.json data/ai-tool-intelligence.csv data/tool_change_history.json data/ai-software-price-tracker.json data/ai-software-price-tracker.csv partner-offers.html partner-offers affiliate-categories.html affiliate-categories ai-tool-finder.html ai-software-shortlist.html ai-software-price-tracker.html ai-tool-database.html ai-tool-alternatives.html ai-tool-changes.html index.html search-intent buyers-guides.html sitemap.xml sitemap-priority.xml robots.txt assets/affiliate-tracking.js api/affiliate-event.js news.html news-archive.html ':(glob)**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize search revenue [skip ci]"
          git push

      - name: Add public-safe completion summary
        run: |
          echo "## Search growth engine" >> "$GITHUB_STEP_SUMMARY"
          echo "Index issues: ${{ steps.search.outputs.issues }}; revenue-weighted opportunities: ${{ steps.search.outputs.opportunities }}; guarded actions: ${{ steps.search.outputs.actions }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Private metrics stayed in the workflow cache/email; only reviewed demand concepts, deterministic pages, crawl assets and snippet choices were eligible for commit." >> "$GITHUB_STEP_SUMMARY"
