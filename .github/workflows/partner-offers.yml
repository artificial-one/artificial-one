name: Build partner offers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - data/partner_offers.json
      - data/affiliate_placements.json
      - data/revenue_strategy.json
      - data/partnerstack_program_audit.json
      - scripts/build_partner_offers.py
      - scripts/monetize_affiliate_links.py
      - scripts/optimize_revenue.py
      - assets/affiliate-tracking.js
      - api/affiliate-event.js
      - ai-tool-finder.html
      - tests/test_partner_offer_pipeline.py
      - tests/test_affiliate_monetization.py
      - tests/test_affiliate_site_output.py
      - scripts/build_tool_intelligence.py
      - tests/test_tool_intelligence.py
  pull_request:
    paths:
      - data/partner_offers.json
      - data/affiliate_placements.json
      - data/revenue_strategy.json
      - data/partnerstack_program_audit.json
      - scripts/build_partner_offers.py
      - scripts/monetize_affiliate_links.py
      - scripts/optimize_revenue.py
      - assets/affiliate-tracking.js
      - api/affiliate-event.js
      - ai-tool-finder.html
      - tests/test_partner_offer_pipeline.py
      - tests/test_affiliate_monetization.py
      - tests/test_affiliate_site_output.py
      - scripts/build_tool_intelligence.py
      - tests/test_tool_intelligence.py

permissions:
  contents: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offer safety rules
        run: |
          python -m unittest discover -s tests -v
          node --check api/affiliate-event.js

      - name: Build approved offers
        run: python scripts/build_partner_offers.py

      - name: Add approved contextual placements
        run: python scripts/monetize_affiliate_links.py

      - name: Refresh normalized tool intelligence
        run: python scripts/build_tool_intelligence.py

      - name: Check generated output
        run: |
          python scripts/build_partner_offers.py --check
          python scripts/monetize_affiliate_links.py --check
          python scripts/build_tool_intelligence.py --check

      - name: Ensure secrets are not tracked
        shell: bash
        run: |
          tracked="$(git ls-files -- .env env data/partner_offers.private.json)"
          if [ -n "$tracked" ]; then
            echo "A private environment or partner file is tracked."
            echo "$tracked"
            exit 1
          fi

      - name: Commit generated pages
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git add -A -- partner-offers.html ai-tool-finder.html ai-tool-database.html ai-tool-alternatives.html ai-tool-changes.html data/tool_intelligence.json data/ai-tool-intelligence.csv data/tool_change_history.json sitemap.xml assets/affiliate-tracking.js api/affiliate-event.js
          if [ -d partner-offers ]; then git add -A -- partner-offers; fi
          git add -A -- '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build approved partner offers [skip ci]"
          git push

      - name: Require generated files in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --exit-code -- '*.html' partner-offers sitemap.xml
