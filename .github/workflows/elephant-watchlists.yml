name: Send Elephant watchlist alerts

on:
  workflow_dispatch:
  schedule:
    # Runs after the vendor-source monitor has published confirmed changes.
    - cron: "21 6 * * *"

permissions:
  contents: read

concurrency:
  group: artificial-one-elephant-watchlists
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Deliver only confirmed watched changes
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WATCHLIST_EMAIL_FROM: ${{ vars.WATCHLIST_EMAIL_FROM }}
        run: python scripts/send_watchlist_alerts.py
