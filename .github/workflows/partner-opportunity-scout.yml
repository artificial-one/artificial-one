name: Discover affiliate opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/partner-opportunity-scout.yml
      - scripts/partner_opportunity_engine.py
      - scripts/affiliate_network_connectors.py
      - scripts/affiliate_source_reconciliation.py
      - tests/test_partner_opportunity_engine.py
      - tests/test_affiliate_network_connectors.py
      - tests/test_affiliate_source_reconciliation.py

permissions:
  contents: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore private opportunity baseline
        uses: actions/cache/restore@v5
        with:
          path: |
            .partner-scout/state.json
            .indexnow/private-state.json
          key: partner-scout-${{ github.run_id }}
          restore-keys: partner-scout-

      - name: Discover, screen and onboard qualified opportunities
        id: scout
        env:
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          SOVRN_COMMERCE_API_KEY: ${{ secrets.SOVRN_COMMERCE_API_KEY }}
          CJ_PUBLISHER_CID: ${{ secrets.CJ_PUBLISHER_CID }}
          CJ_PERSONAL_ACCESS_TOKEN: ${{ secrets.CJ_PERSONAL_ACCESS_TOKEN }}
          RAKUTEN_ACCESS_TOKEN: ${{ secrets.RAKUTEN_ACCESS_TOKEN }}
        run: >-
          python scripts/partner_opportunity_engine.py
          --state .partner-scout/state.json

      - name: Build newly activated offers through the existing safe pipeline
        run: |
          python scripts/build_partner_offers.py
          python scripts/build_search_revenue_pages.py
          python scripts/monetize_affiliate_links.py
          python scripts/build_tool_intelligence.py
          python scripts/consolidate_legacy_index.py
          python scripts/affiliate_source_reconciliation.py
          INDEXNOW_SUBMIT_ENABLED=true python scripts/indexing_recovery.py --submit --state .indexnow/private-state.json

      - name: Verify opportunity and publishing safety
        run: |
          python -m unittest tests.test_partner_opportunity_engine tests.test_affiliate_network_connectors tests.test_affiliate_source_reconciliation tests.test_partner_offer_pipeline -v
          python scripts/build_partner_offers.py --check
          python scripts/build_search_revenue_pages.py --check
          python scripts/monetize_affiliate_links.py --check
          python scripts/build_tool_intelligence.py --check
          python scripts/consolidate_legacy_index.py --check
          python scripts/affiliate_source_reconciliation.py --check
          python scripts/indexing_recovery.py --check

      - name: Commit public-safe inventory and newly activated offers
        shell: bash
        run: |
          git add -- data/partner_opportunities.json data/affiliate_network_status.json data/affiliate_source_reconciliation.json data/partner_offers.json data/partnerstack_program_audit.json data/tool_intelligence.json data/ai-tool-intelligence.csv data/indexing_recovery.json data/legacy_index_consolidation.json partner-opportunities.html partner-offers.html partner-offers search-intent calculators ai-tool-finder.html ai-tool-database.html ai-tool-alternatives.html ai-tool-changes.html buyers-guides.html sitemap.xml assets/affiliate-tracking.js ':(glob)tools/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh affiliate opportunity pipeline [skip ci]"
          git push

      - name: Save private opportunity baseline
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .partner-scout/state.json
            .indexnow/private-state.json
          key: partner-scout-${{ github.run_id }}

      - name: Publish privacy-safe summary
        if: always()
        shell: bash
        run: |
          echo "## Affiliate opportunity scout" >> "$GITHUB_STEP_SUMMARY"
          echo "Actionable opportunities: ${{ steps.scout.outputs.actionable }}; automatically onboarded: ${{ steps.scout.outputs.onboarded }}." >> "$GITHUB_STEP_SUMMARY"
          echo "Awin, CJ, Sovrn and Rakuten are queried automatically when their narrowly scoped repository secrets are present." >> "$GITHUB_STEP_SUMMARY"
          echo "All current and future connector records are reconciled against exact public-page affiliate links before deployment." >> "$GITHUB_STEP_SUMMARY"
          echo "No application quota is imposed. Binding applications and terms remain an owner action." >> "$GITHUB_STEP_SUMMARY"
