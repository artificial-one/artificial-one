name: Affiliate network cloud monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/partnerstack-cloud-monitor.yml
      - scripts/affiliate_network_monitor.py
      - scripts/appsumo_impact.py
      - data/impact_connection.json
  schedule:
    # 07:23 UTC is morning in Europe/Prague and avoids peak-hour scheduling.
    - cron: "23 7 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore private aggregate and availability baselines
        uses: actions/cache/restore@v4
        with:
          path: |
            .affiliate-monitor/baseline.json
            .appsumo-monitor/availability.json
          key: affiliate-network-private-${{ github.run_id }}
          restore-keys: |
            affiliate-network-private-

      - name: Refresh AppSumo inventory, availability and page attribution
        run: python scripts/appsumo_impact.py --live-check --state .appsumo-monitor/availability.json

      - name: Audit PartnerStack and Impact through read-only APIs
        id: monitor
        env:
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: >-
          python scripts/affiliate_network_monitor.py
          --baseline .affiliate-monitor/baseline.json
          --email-to hello@artificial.one
          --email-from "Artificial.One Partner Monitor <onboarding@resend.dev>"

      - name: Verify public AppSumo assets and safety rules
        run: |
          python -m unittest tests.test_appsumo_impact -v
          python scripts/appsumo_impact.py --check
          node --check assets/affiliate-tracking.js

      - name: Commit public availability and generated site changes
        shell: bash
        run: |
          git add -- data/appsumo_offers.json appsumo-ai-tools.html sitemap.xml assets/affiliate-tracking.js ':(glob)**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh AppSumo availability [skip ci]"
          git push

      - name: Add public-safe result to the workflow summary
        if: always() && steps.monitor.outcome == 'success'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Affiliate network cloud monitor

          The read-only PartnerStack/Impact audit and AppSumo availability check completed. The consolidated private dashboard was emailed to the configured recipient.
          Financial and customer metrics are intentionally omitted from this public repository's Actions summary.
          EOF

      - name: Save private aggregate and availability baselines
        if: steps.monitor.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .affiliate-monitor/baseline.json
            .appsumo-monitor/availability.json
          key: affiliate-network-private-${{ github.run_id }}

      - name: Notify the repository owner about a meaningful change
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          cat > /tmp/partnerstack-notice.md <<EOF
          The cloud monitor detected a meaningful change in sanitized PartnerStack or Impact aggregate data.

          Review the private [PartnerStack](https://dash.partnerstack.com/home) or [Impact](https://app.impact.com/) dashboard before changing public content.

          Automated run: ${RUN_URL}
          EOF
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Affiliate network monitor: attention needed ($(date -u +%F))" \
            --body-file /tmp/partnerstack-notice.md \
            --assignee artificial-one
