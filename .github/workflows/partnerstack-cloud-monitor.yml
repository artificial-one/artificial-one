name: Affiliate network cloud monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/partnerstack-cloud-monitor.yml
      - scripts/impact_appsumo_scout.py
      - scripts/affiliate_network_monitor.py
      - scripts/partnerstack_cloud_monitor.py
      - scripts/appsumo_impact.py
      - assets/affiliate-tracking.js
      - api/affiliate-event.js
      - tests/test_partnerstack_cloud_monitor.py
      - tests/test_appsumo_impact.py
      - data/impact_connection.json
  schedule:
    # 07:23 UTC is morning in Europe/Prague and avoids peak-hour scheduling.
    - cron: "23 7 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: artificial-one-site-publisher
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore private aggregate and availability baselines
        uses: actions/cache/restore@v4
        with:
          path: |
            .affiliate-monitor/baseline.json
            .appsumo-monitor/availability.json
            .indexnow/private-state.json
          key: affiliate-network-private-${{ github.run_id }}
          restore-keys: |
            affiliate-network-private-

      - name: Discover every AppSumo product asset and create missing tracking links
        id: appsumo_scout
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
        run: python scripts/impact_appsumo_scout.py

      - name: Refresh AppSumo inventory, availability and page attribution
        run: python scripts/appsumo_impact.py --live-check --state .appsumo-monitor/availability.json

      - name: Refresh normalized tool intelligence
        run: python scripts/build_tool_intelligence.py

      - name: Refresh crawl discovery and notify participating search engines
        env:
          INDEXNOW_SUBMIT_ENABLED: "true"
        run: python scripts/indexing_recovery.py --submit --state .indexnow/private-state.json

      - name: Audit PartnerStack and Impact through read-only APIs
        id: monitor
        env:
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: >-
          python scripts/affiliate_network_monitor.py
          --baseline .affiliate-monitor/baseline.json
          --email-to hello@artificial.one
          --email-from "Artificial.One Partner Monitor <onboarding@resend.dev>"

      - name: Verify public AppSumo assets and safety rules
        run: |
          python -m unittest tests.test_appsumo_impact -v
          python -m unittest tests.test_impact_appsumo_scout -v
          python -m unittest tests.test_tool_intelligence -v
          python scripts/appsumo_impact.py --check
          python scripts/build_tool_intelligence.py --check
          python scripts/indexing_recovery.py --check
          node --check assets/affiliate-tracking.js

      - name: Commit public availability and generated site changes
        shell: bash
        run: |
          git add -- data/appsumo_offers.json data/indexing_recovery.json data/tool_intelligence.json data/ai-tool-intelligence.csv data/tool_change_history.json appsumo-ai-tools.html ai-tool-database.html ai-tool-alternatives.html ai-tool-changes.html buyers-guides.html index.html sitemap.xml assets/affiliate-tracking.js ':(glob)**/*.html'
          if [ -e data/appsumo_impact_ads.json ]; then git add -- data/appsumo_impact_ads.json; fi
          if [ -d appsumo-guides ]; then git add -- appsumo-guides; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh AppSumo availability"
          git push

      - name: Add public-safe result to the workflow summary
        if: always() && steps.monitor.outcome == 'success'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Affiliate network cloud monitor

          The read-only PartnerStack/Impact audit and AppSumo availability check completed. The consolidated private dashboard was emailed to the configured recipient.
          AppSumo products discovered: ${{ steps.appsumo_scout.outputs.products }}; new assets: ${{ steps.appsumo_scout.outputs.new_items }}; missing tracking links created: ${{ steps.appsumo_scout.outputs.links_created }}.
          Impact Ads permission required: ${{ steps.appsumo_scout.outputs.permission_required }}.
          Financial and customer metrics are intentionally omitted from this public repository's Actions summary.
          EOF

      - name: Save private aggregate and availability baselines
        if: steps.monitor.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .affiliate-monitor/baseline.json
            .appsumo-monitor/availability.json
            .indexnow/private-state.json
          key: affiliate-network-private-${{ github.run_id }}

      - name: Notify the repository owner about a meaningful change
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          cat > /tmp/partnerstack-notice.md <<EOF
          The cloud monitor detected a meaningful change in sanitized PartnerStack or Impact aggregate data.

          Review the private [PartnerStack](https://dash.partnerstack.com/home) or [Impact](https://app.impact.com/) dashboard before changing public content.

          Automated run: ${RUN_URL}
          EOF
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Affiliate network monitor: attention needed ($(date -u +%F))" \
            --body-file /tmp/partnerstack-notice.md \
            --assignee artificial-one
